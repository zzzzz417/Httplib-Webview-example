<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日程管理器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-area">
                <h1>我的日程</h1>
                <p class="subtitle">今日事，今日毕</p>
            </div>
            <button id="addBtn" class="primary-btn">＋ 新增任务</button>
        </header>

        <main id="scheduleList" class="scroll-container">
            </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>✨ 新增任务</h2>
            <div class="input-group">
                <input type="text" id="ocName" placeholder="任务标题..." class="main-input">
                
                <div class="time-picker-container">
                    <label>开始时间</label>
                    <div class="date-row">
                        <input type="date" id="beginDate">
                    </div>
                    <div class="hms-row">
                        <input type="number" id="hr" min="0" max="23" placeholder="时">
                        <span>:</span>
                        <input type="number" id="min" min="0" max="59" placeholder="分">
                        <span>:</span>
                        <input type="number" id="sec" min="0" max="59" placeholder="秒">
                    </div>
                </div>

                <input type="number" id="stayTime" placeholder="预计持续时长 (分钟)">
                <textarea id="remark" placeholder="添加备忘备注..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" onclick="submitData()">立即保存</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
